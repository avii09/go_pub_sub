<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#555"/>
    </marker>
  </defs>

  <!-- background (keeps it readable in GitHub dark mode) -->
  <rect x="0" y="0" width="960" height="400" rx="16" fill="#ffffff"/>

  <!-- Publisher -->
  <rect x="30" y="170" width="130" height="60" rx="10" fill="#e8f0fe" stroke="#4a6fa5" stroke-width="2"/>
  <text x="95" y="198" text-anchor="middle" font-size="17" font-weight="bold" fill="#1f3b63">Publisher</text>
  <text x="95" y="218" text-anchor="middle" font-size="12" fill="#4a6fa5">1000 msg/s</text>

  <!-- Broker container -->
  <rect x="230" y="40" width="520" height="320" rx="14" fill="#f6f7f9" stroke="#9aa0a6" stroke-width="2"/>
  <text x="250" y="70" font-size="18" font-weight="bold" fill="#333">Broker</text>
  <text x="490" y="78" text-anchor="middle" font-size="12" fill="#777">queue per subscriber</text>
  <text x="650" y="78" text-anchor="middle" font-size="12" fill="#777">writer goroutine</text>

  <!-- Publisher → Broker (drawn after the broker box so it stays on top) -->
  <line x1="160" y1="200" x2="256" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="200" y="190" text-anchor="middle" font-size="12" fill="#777">TCP</text>

  <!-- Publish -->
  <rect x="260" y="170" width="110" height="60" rx="10" fill="#fff4e5" stroke="#d48a1d" stroke-width="2"/>
  <text x="315" y="206" text-anchor="middle" font-size="16" font-weight="bold" fill="#8a5410">Publish</text>

  <!-- Publish → queues -->
  <path d="M370,200 C400,200 400,110 428,110" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="370" y1="200" x2="428" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M370,200 C400,200 400,290 428,290" fill="none" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Queue A: nearly empty -->
  <g>
    <rect x="430" y="90" width="120" height="40" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <rect x="520" y="90" width="30" height="40" fill="#bcd5f5"/>
    <line x1="460" y1="90" x2="460" y2="130" stroke="#666"/>
    <line x1="490" y1="90" x2="490" y2="130" stroke="#666"/>
    <line x1="520" y1="90" x2="520" y2="130" stroke="#666"/>
    <rect x="430" y="90" width="120" height="40" rx="4" fill="none" stroke="#666" stroke-width="1.5"/>
  </g>
  <!-- Queue B: nearly empty -->
  <g>
    <rect x="430" y="180" width="120" height="40" rx="4" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
    <rect x="520" y="180" width="30" height="40" fill="#bcd5f5"/>
    <line x1="460" y1="180" x2="460" y2="220" stroke="#666"/>
    <line x1="490" y1="180" x2="490" y2="220" stroke="#666"/>
    <line x1="520" y1="180" x2="520" y2="220" stroke="#666"/>
    <rect x="430" y="180" width="120" height="40" rx="4" fill="none" stroke="#666" stroke-width="1.5"/>
  </g>
  <!-- Queue SLOW: full -->
  <g>
    <rect x="430" y="270" width="120" height="40" rx="4" fill="#f4a9a3" stroke="#c62828" stroke-width="1.5"/>
    <line x1="460" y1="270" x2="460" y2="310" stroke="#c62828"/>
    <line x1="490" y1="270" x2="490" y2="310" stroke="#c62828"/>
    <line x1="520" y1="270" x2="520" y2="310" stroke="#c62828"/>
    <text x="490" y="327" text-anchor="middle" font-size="12" font-weight="bold" fill="#c62828">FULL</text>
  </g>

  <!-- Queues → writers -->
  <line x1="550" y1="110" x2="588" y2="110" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="200" x2="588" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="290" x2="588" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Writers -->
  <rect x="590" y="88" width="120" height="44" rx="8" fill="#ede7f6" stroke="#6a4fa3" stroke-width="2"/>
  <text x="650" y="115" text-anchor="middle" font-size="14" fill="#3f2a6b">writer</text>
  <rect x="590" y="178" width="120" height="44" rx="8" fill="#ede7f6" stroke="#6a4fa3" stroke-width="2"/>
  <text x="650" y="205" text-anchor="middle" font-size="14" fill="#3f2a6b">writer</text>
  <rect x="590" y="268" width="120" height="44" rx="8" fill="#ede7f6" stroke="#6a4fa3" stroke-width="2"/>
  <text x="650" y="295" text-anchor="middle" font-size="14" fill="#3f2a6b">writer</text>

  <!-- Writers → subscribers -->
  <line x1="710" y1="110" x2="798" y2="110" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="200" x2="798" y2="200" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="710" y1="290" x2="798" y2="290" stroke="#555" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="772" y="100" text-anchor="middle" font-size="12" fill="#777">TCP</text>
  <text x="772" y="190" text-anchor="middle" font-size="12" fill="#777">TCP</text>
  <text x="772" y="280" text-anchor="middle" font-size="12" fill="#777">TCP</text>

  <!-- Subscribers -->
  <rect x="800" y="86" width="130" height="48" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="865" y="107" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">fast-A</text>
  <text x="865" y="125" text-anchor="middle" font-size="12" fill="#2e7d32">1000 msg/s</text>

  <rect x="800" y="176" width="130" height="48" rx="10" fill="#e6f4ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="865" y="197" text-anchor="middle" font-size="16" font-weight="bold" fill="#1b5e20">fast-B</text>
  <text x="865" y="215" text-anchor="middle" font-size="12" fill="#2e7d32">1000 msg/s</text>

  <rect x="800" y="266" width="130" height="48" rx="10" fill="#fdecea" stroke="#c62828" stroke-width="2"/>
  <text x="865" y="287" text-anchor="middle" font-size="16" font-weight="bold" fill="#b71c1c">SLOW</text>
  <text x="865" y="305" text-anchor="middle" font-size="12" fill="#c62828">10 msg/s</text>

  <!-- The question -->
  <text x="490" y="348" text-anchor="middle" font-size="14" fill="#333">Queue full? The policy decides: <tspan font-weight="bold">drop</tspan> · <tspan font-weight="bold">buffer</tspan> · <tspan font-weight="bold">block</tspan></text>
</svg>
